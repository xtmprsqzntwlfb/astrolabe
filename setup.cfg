[metadata]
name = astrolabe
version = attr: astrolabe.__version__
description = Show the CLI and REST equivalents of OpenStack Horizon actions
# setuptools, not pbr: it reads long_description, and silently ignores the
# summary/description_file spellings pbr uses. Getting that wrong publishes
# a package whose page is blank below the one-line summary, which is most of
# the documentation missing with nothing to say so.
long_description = file: README.rst
long_description_content_type = text/x-rst
author = Tatiana Ovchinnikova
author_email = t.v.ovtchinnikova@gmail.com
license = Apache-2.0
project_urls =
    Source = https://github.com/xtmprsqzntwlfb/astrolabe
    Issues = https://github.com/xtmprsqzntwlfb/astrolabe/issues
    Changelog = https://github.com/xtmprsqzntwlfb/astrolabe/blob/main/CHANGELOG.rst
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: OpenStack
    Environment :: Web Environment
    Framework :: Django
    Intended Audience :: System Administrators
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: System :: Systems Administration

[options]
python_requires = >=3.11
packages = find:
include_package_data = True

[options.packages.find]
include =
    astrolabe
    astrolabe.*

[options.package_data]
astrolabe =
    templates/astrolabe/*.html
    enabled/*.py

# Mirrors Horizon's own pep8 job, so a change that lints clean upstream lints
# clean here. W504 is off because it contradicts W503, and OpenStack picked
# W503. The line length really is 80 upstream, not 79.
[flake8]
ignore = W504
enable-extensions = H106,H203,H204,H205,H904
max-complexity = 20
max_line_length = 80
exclude = .git,.tox,build,dist,*.egg-info
import-order-style = pep8
application-import-names = astrolabe

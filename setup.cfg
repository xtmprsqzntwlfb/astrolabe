[metadata]
name = astrolabe
summary = Astrolabe — show the CLI and REST equivalents of Horizon actions
description_file = README.rst
author = Your Team
license = Apache-2.0
classifiers =
    Environment :: OpenStack
    Framework :: Django
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3

[options]
python_requires = >=3.9
packages = find:
include_package_data = True

[options.packages.find]
include =
    astrolabe
    astrolabe.*

[options.package_data]
astrolabe =
    templates/astrolabe/*.html
    enabled/*.py

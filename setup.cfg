[metadata]
name = astrolabe
summary = Astrolabe — show the CLI and REST equivalents of Horizon actions
description_file = README.rst
author = Your Team
license = Apache-2.0
classifiers =
    Environment :: OpenStack
    Framework :: Django
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3

[options]
python_requires = >=3.9
packages = find:
include_package_data = True

[options.packages.find]
include =
    astrolabe
    astrolabe.*

[options.package_data]
astrolabe =
    templates/astrolabe/*.html
    enabled/*.py

# Mirrors Horizon's own pep8 job, so a change that lints clean upstream lints
# clean here. W504 is off because it contradicts W503, and OpenStack picked
# W503. The line length really is 80 upstream, not 79.
[flake8]
ignore = W504
enable-extensions = H106,H203,H204,H205,H904
max-complexity = 20
max_line_length = 80
exclude = .git,.tox,build,dist,*.egg-info
import-order-style = pep8
application-import-names = astrolabe
